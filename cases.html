{% extends 'base.html' %}{% block content %}<div class="card"><div class="label">VIRTUAL AUDIT CASES</div><h2>Cases</h2></div><div class="card" style="margin-top:15px"><table class="table"><tr><th>Case</th><th>TIN</th><th>Taxpayer</th><th>Sector</th><th>Status</th><th>Assigned</th><th></th></tr>{% for r in rows %}<tr><td>{{ r.case_ref }}</td><td>{{ r.tin }}</td><td>{{ r.taxpayer_name }}</td><td>{{ r.sector }}</td><td>{{ r.status }}</td><td>{{ r.assigned_to }}</td><td><a class="btn secondary" href="{{ url_for('case_detail',cid=r.id) }}">Open</a></td></tr>{% else %}<tr><td colspan="7">No cases.</td></tr>{% endfor %}</table></div>{% endblock %}
