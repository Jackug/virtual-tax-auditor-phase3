{% extends 'base.html' %}{% block content %}<div class="card"><div class="label">HUMAN COMMUNICATION CONTROL</div><h2>Taxpayer Communication</h2><p><b>Case:</b> {{ case.case_ref }}</p></div><div class="card" style="margin-top:15px">{% if findings %}<form method="post"><label>Finding</label><select name="finding_id">{% for f in findings %}<option value="{{ f.id }}" {% if selected and f.id==selected.id %}selected{% endif %}>{{ f.finding_ref }} — {{ f.description }}</option>{% endfor %}</select><label>Recipient</label><input name="recipient" value="{{ recipient }}" required><label>Subject</label><input name="subject" value="{{ subject }}" required><div class="two"><div><label>Original AI draft</label><textarea readonly>{{ ai_draft }}</textarea></div><div><label>Human-edited communication</label><textarea name="body" required>{{ body }}</textarea></div></div><div class="notice"><b>Human approval required before sending.</b></div><label><input type="checkbox" name="approve_send" value="1" style="width:auto"> I approve this communication for sending.</label><button class="btn">Save / Approve</button></form>{% else %}<div class="notice">No Human Validated finding is available.</div>{% endif %}</div>{% endblock %}
