services:
  - type: web
    name: virtual-tax-auditor-phase3
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: GOOGLE_CLIENT_SECRETS
        value: /etc/secrets/client_secret.json
      - key: BASE_URL
        value: https://virtual-tax-auditor-phase3.onrender.com
      - key: COOKIE_SECURE
        value: "1"
      - key: FLASK_SECRET_KEY
        generateValue: true
