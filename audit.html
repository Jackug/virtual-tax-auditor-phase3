{% extends 'base.html' %}{% block content %}<div class="card"><div class="label">AUDIT TRAIL</div><h2>Audit Trail</h2></div><div class="card" style="margin-top:15px"><table class="table"><tr><th>Date</th><th>Actor</th><th>Case</th><th>Event</th><th>Detail</th></tr>{% for e in events %}<tr><td>{{ e.created_at }}</td><td>{{ e.actor_email }}</td><td>{{ e.case_ref or '—' }}</td><td>{{ e.event_type }}</td><td>{{ e.detail }}</td></tr>{% else %}<tr><td colspan="5">No events.</td></tr>{% endfor %}</table></div>{% endblock %}
